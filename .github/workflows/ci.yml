name: CI

# Runs on every push and on pull requests. The jobs are independent where they
# can be, so a formatting slip does not hide a failing test and vice versa.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older, still-running run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, vet and modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod or go.sum is out of date; run 'go mod tidy' and commit the result."
            exit 1
          }

      - name: Verify module checksums
        run: go mod verify

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The minimum version named in go.mod, and whatever is current, so a
        # newer toolchain cannot break us unnoticed.
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # -race catches data races in the cache, locks and handlers. -shuffle
      # exposes tests that only pass in one order. -count=1 defeats the test
      # cache so CI always runs the tests for real.
      - name: go test
        run: >
          go test -race -shuffle=on -count=1 -timeout 10m
          -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          test -f coverage.out || exit 0
          {
            echo "### Coverage (Go ${{ matrix.go }})"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The same flags as 'make build', which the Docker image will use too:
      # static, reproducible, no debug symbols.
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/server

  e2e:
    name: End-to-end script
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Starts the real binary on a free port with throwaway directories, runs
      # every check over HTTP, restarts it to prove persistence, and fails the
      # job if any check fails. curl and jq are preinstalled on the runner.
      - name: sample_test/integration_test.sh
        run: ./sample_test/integration_test.sh
