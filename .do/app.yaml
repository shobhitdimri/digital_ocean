# DigitalOcean App Platform spec. Create with:
#   doctl apps create --spec .do/app.yaml
# or paste it into the control panel. The app builds from the Dockerfile.
# This is the spec of the running deployment. The name differs from the repo
# because another app called feature-flag-service already exists in the account.
name: ffs-go-feature-flags
region: blr
services:
  - name: api
    git:
      repo_clone_url: https://github.com/shobhitdimri/digital_ocean.git
      branch: main
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
    envs:
      - key: SHUTDOWN_TIMEOUT
        value: 10s
      - key: LOG_LEVEL
        value: info
